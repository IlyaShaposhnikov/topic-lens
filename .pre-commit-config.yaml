# Catches locally what CI would otherwise catch minutes later.
#   pre-commit install
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # The demo bundle is ~1.3 MB and ships with the repository on purpose, so
      # the hosted app starts without training. Nothing else should be this big.
      - id: check-added-large-files
        args: [--maxkb=2000]
